<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo RPG Chatbot</title>
    <!-- Fuente estilo pixel art de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
 
        body {
            background-color: #1a1c23;
            /* Fondo de patrón de puntos retro */
            background-image: radial-gradient(#2c303b 15%, transparent 16%);
            background-size: 16px 16px;
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
 
        .game-container {
            width: 90%;
            max-width: 700px;
            height: 85vh;
            background-color: #0b0c10;
            /* Borde clásico estilo NES/SNES gruesos y sólidos */
            border: 6px solid #c5c5c5;
            box-shadow: 0 0 0 4px #000000, 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }
 
        /* Barra superior estilo ventana de juego */
        .game-header {
            background-color: #e60012; /* Rojo icónico de Nintendo */
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 4px solid #000;
        }
 
        .game-title {
            font-size: 10px;
            color: #fff;
            text-shadow: 2px 2px #000;
            letter-spacing: 1px;
        }
 
        .game-hud {
            font-size: 8px;
            background: #000;
            padding: 4px 8px;
            border: 2px solid #fff;
            color: #ffe600;
        }
 
        /* Área de mensajes (Pantalla de diálogo) */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #12141c;
        }
 
        .message {
            max-width: 80%;
            padding: 12px 16px;
            font-size: 9px;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
            white-space: pre-wrap; /* respeta saltos de línea y listas numeradas */
        }
 
        /* Estilo de bocadillo/caja de texto de RPG */
        .message.bot {
            align-self: flex-start;
            background-color: #0d1b2a;
            border: 3px solid #415a77;
            color: #e0e1dd;
            box-shadow: 3px 3px 0px #000;
        }
 
        .message.bot::before {
            content: "▶ ";
            color: #ffe600;
        }
 
        .message.bot.error {
            border-color: #e60012;
            color: #ffb3b8;
        }
 
        .message.user {
            align-self: flex-end;
            background-color: #07110a;
            border: 3px solid #39e75f;
            color: #b8ffc4;
            box-shadow: -3px 3px 0px #000;
        }
 
        /* Fuentes (documento, página y fragmento) */
        .sources {
            margin-top: 12px;
            white-space: normal;
            font-size: 8px;
            color: #ffe600;
        }
 
        .sources summary {
            cursor: pointer;
        }
 
        .source-item {
            margin-top: 8px;
            padding: 8px;
            background: #000;
            border: 2px solid #415a77;
            color: #e0e1dd;
        }
 
        .source-item b {
            display: block;
            color: #39e75f;
            font-weight: normal;
            margin-bottom: 6px;
        }
 
        .source-item span {
            display: block;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            color: #b9bfc9;
        }
 
        /* Zona de entrada de texto */
        .input-container {
            padding: 15px;
            background-color: #0b0c10;
            border-top: 4px solid #c5c5c5;
            display: flex;
            gap: 10px;
        }
 
        input[type="text"] {
            flex: 1;
            background-color: #000;
            border: 3px solid #707070;
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #fff;
            outline: none;
        }
 
        input[type="text"]:focus {
            border-color: #ffe600;
        }
 
        button {
            background-color: #ffe600;
            color: #000;
            border: 3px solid #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 0 16px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #fff;
            transition: transform 0.1s ease;
        }
 
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #fff;
        }
 
        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }
 
        #reset-btn {
            background-color: #fff;
            padding: 6px 10px;
            box-shadow: 2px 2px 0px #000;
        }
 
        /* Scrollbar personalizado retro */
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: #0b0c10;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border: 2px solid #0b0c10;
        }
    </style>
</head>
<body>
 
    <div class="game-container">
        <!-- Barra de título / HUD -->
        <div class="game-header">
            <span class="game-title">🎮 NINTENDO CHAT v1.0</span>
            <button id="reset-btn" type="button" onclick="resetChat()">NUEVA PARTIDA</button>
        </div>
 
        <!-- Caja de texto principal del RPG -->
        <div class="chat-box" id="chat-box"></div>
 
        <!-- Controles de escritura -->
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Escribe un comando..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">ENVIAR</button>
        </div>
    </div>
 
    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const WELCOME = "¡Hola, Jugador 1! Pregúntame sobre los manuales de Nintendo Switch 2. Puedes hacer preguntas de seguimiento.";
 
        // El servidor no guarda estado: el historial vive aquí y se envía en cada petición
        let history = [];
 
        // Permitir enviar con la tecla Enter
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
 
        function appendMessage(text, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll hacia abajo
            return messageDiv;
        }
 
        function appendSources(messageDiv, sources) {
            if (!sources || sources.length === 0) return;
            const details = document.createElement("details");
            details.className = "sources";
            const summary = document.createElement("summary");
            summary.textContent = "FUENTES (" + sources.length + ")";
            details.appendChild(summary);
 
            sources.forEach(function(src) {
                const item = document.createElement("div");
                item.className = "source-item";
                const title = document.createElement("b");
                title.textContent = src.source + " - pág. " + (src.page ?? "?");
                const snippet = document.createElement("span");
                snippet.textContent = src.snippet + (src.snippet.length >= 350 ? "…" : "");
                item.append(title, snippet);
                details.appendChild(item);
            });
            messageDiv.appendChild(details);
        }
 
        function resetChat() {
            history = [];
            chatBox.textContent = "";
            appendMessage(WELCOME, "bot");
        }
 
        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === "" || sendBtn.disabled) return;
 
            appendMessage(text, "user");
            userInput.value = "";
            sendBtn.disabled = true;
            const pending = appendMessage("Buscando en los manuales...", "bot");
 
            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: text, history: history })
                });
 
                const data = await response.json();
                if (!response.ok) {
                    pending.textContent = data.error || "Error desconocido.";
                    pending.classList.add("error");
                    return;
                }
 
                pending.textContent = data.response;
                appendSources(pending, data.sources);
                history.push({ role: "user", content: text });
                history.push({ role: "assistant", content: data.response });
                history = history.slice(-12);
            } catch (error) {
                pending.textContent = "ERROR DE RED: El cartucho se ha desconectado.";
                pending.classList.add("error");
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
 
        resetChat();
    </script>
</body>
</html>
